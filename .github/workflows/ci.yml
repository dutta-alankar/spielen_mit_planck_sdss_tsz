name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project and dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run test suite (offline / simulated data)
        run: uv run pytest -q

      - name: Smoke-test the full pipeline on simulated data
        run: uv run python -m planck_cmb all --simulate --nside-sim 64 --n-objects 100

      - name: Upload generated figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-py${{ matrix.python-version }}
          path: figures/*.png
          if-no-files-found: ignore

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # Advisory: style findings should not block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff check
        run: uvx ruff check planck_cmb scripts tests
